<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2c3e50">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>আমার গানের খাতা (ক্লাউড ব্যাকআপ)</title>
<style>
:root{--site-bg:#fdfaf0;--header-bg:#2c3e50;--sidebar-bg:#f1f2f6}
*{box-sizing:border-box}body{font-family:"Segoe UI",Arial,sans-serif;background:var(--site-bg);margin:0;padding:10px;color:#2d3436}
.hidden{display:none!important}button,input,textarea{font:inherit}input[type=text],input[type=email],input[type=password],textarea{width:100%;padding:10px;margin:8px 0 15px;border:1px solid #b2bec3;border-radius:6px;font-size:14px}
.btn{background:#2c3e50;color:white;border:0;padding:10px 16px;border-radius:6px;cursor:pointer;font-weight:bold;font-size:14px}.btn:disabled{opacity:.6;cursor:wait}
#authContainer{max-width:400px;margin:40px auto;background:white;padding:25px;border-radius:12px;box-shadow:0 4px 15px #0001;text-align:center}
.password-wrapper{position:relative;display:flex;align-items:center}.password-wrapper input{padding-right:42px}.toggle-password{position:absolute;right:12px;top:35%;cursor:pointer}
.social-btn{width:100%;padding:12px;margin-top:10px;border:1px solid #b2bec3;border-radius:6px;font-weight:bold;cursor:pointer}.google-btn{background:white;color:#555}.facebook-btn{background:#1877f2;color:white;border:0}
.divider{margin:20px 0;color:#7f8c8d;font-size:13px}.divider:before,.divider:after{content:"";display:inline-block;width:25%;border-bottom:1px solid #b2bec3;vertical-align:middle;margin:0 8px}
header{background:var(--header-bg);color:white;display:flex;flex-direction:column;gap:12px;align-items:center;padding:15px;border-radius:12px;margin-bottom:18px;text-align:center}header h1{margin:0;font-size:22px}.user-info{font-size:13px;display:flex;gap:8px;align-items:center;max-width:100%;overflow-wrap:anywhere}
.search-wrapper{width:100%;max-width:500px}.search-bar{border-radius:25px!important;margin:0!important}
.nav-tabs{display:flex;gap:8px;margin-bottom:15px;overflow-x:auto;padding:5px}.tab-btn{border:0;padding:10px 16px;cursor:pointer;border-radius:30px;font-weight:bold;white-space:nowrap;flex-shrink:0}.tab-btn:nth-child(1){background:#2ecc71;color:white}.tab-btn:nth-child(2){background:#f1c40f}.tab-btn:nth-child(3){background:#9b59b6;color:white}.tab-btn:nth-child(4){background:#e67e22;color:white}.tab-btn.active{outline:2px solid #2d3436;outline-offset:1px}
.container{display:flex;flex-direction:column;gap:18px}.sidebar{background:var(--sidebar-bg);padding:15px;border-radius:12px;border:1px solid #b2bec3;height:fit-content}.sidebar h3{margin-top:0;color:#2c3e50;border-bottom:2px solid #b2bec3;padding-bottom:8px}.main-content{flex:1;padding:12px;border-radius:12px;min-height:300px;min-width:0}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;background:white;margin-bottom:10px;border-radius:8px;cursor:pointer;border-left:5px solid #74b9ff;box-shadow:0 2px 5px #0000000d;position:relative;overflow-wrap:anywhere}.list-item:hover{background:#f1f2f6}.list-item.active{background:#ffeaa7;border-left-color:#fdcb6e}
.three-dot{font-size:20px;cursor:pointer;padding:5px 8px;color:#7f8c8d;flex-shrink:0}.dropdown-menu{display:none;position:absolute;right:8px;top:38px;background:white;border:1px solid #b2bec3;border-radius:6px;box-shadow:0 4px 12px #0002;z-index:100;width:150px}.dropdown-menu div{padding:10px;font-size:14px;cursor:pointer}.dropdown-menu div:hover{background:#74b9ff;color:white}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:1000;justify-content:center;align-items:center;padding:10px}.modal-content{background:white;padding:20px;border-radius:12px;width:100%;max-width:350px;text-align:center}.modal-item{padding:10px;background:#f1f2f6;margin-bottom:8px;border-radius:6px;cursor:pointer;font-weight:bold}
.diary-page{text-align:center;padding:10px}.diary-page h2{font-size:25px;color:#2c3e50}.song-meta-row{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin-bottom:20px;font-weight:bold;color:#7f8c8d}.meta-item-editable{background:transparent;border:0!important;border-bottom:1px dashed #d63031!important;color:#d63031;width:85px!important;text-align:center;padding:2px!important;margin:0!important}
.nobox-textarea{background:transparent;border:0!important;width:100%;font-size:18px;font-weight:500;color:#2c3e50;text-align:center;resize:vertical;line-height:1.8;outline:none;margin-bottom:20px;font-family:inherit}.section-label{font-weight:bold;color:#e67e22;font-size:14px;letter-spacing:1px;margin:20px auto 5px;display:block;border-bottom:1px double #b2bec3;width:fit-content;padding-bottom:2px}
.boxed-textarea{max-width:600px;margin:12px auto;display:block;background:white}.audio-link-section{background:#e1f5fe;padding:12px;border-radius:8px;max-width:600px;margin:20px auto;border:1px dashed #0288d1}#audioPlayContainer a{overflow-wrap:anywhere}
.status-msg{font-size:13px;text-align:center;color:#555;min-height:18px}.empty{color:#7f8c8d;text-align:center}.form-row{display:flex;gap:8px;align-items:center}.form-row input{min-width:0}.form-row button{flex-shrink:0}
@media(min-width:768px){header{flex-direction:row;justify-content:space-between;padding:15px 22px}header h1{font-size:23px}.search-wrapper{width:35%}.container{flex-direction:row;gap:24px}.sidebar{width:290px;flex-shrink:0}.diary-page{padding:20px}}
</style>
</head>
<body>
<div id="authContainer">
<h2>🎵 আমার গানের খাতা 🎶</h2><p>ক্লাউড ব্যাকআপের জন্য লগইন/রেজিস্ট্রেশন করুন</p>
<input type="email" id="emailInput" placeholder="আপনার ইমেইল..." autocomplete="email">
<div class="password-wrapper"><input type="password" id="passInput" placeholder="পাসওয়ার্ড..." autocomplete="current-password"><span class="toggle-password" id="eyeIcon" role="button" aria-label="পাসওয়ার্ড দেখুন">👁️</span></div>
<button class="btn" id="loginBtn" style="width:100%;background:#2ecc71;margin-bottom:8px">লগইন করুন</button>
<button class="btn" id="registerBtn" style="width:100%;background:#9b59b6">নতুন অ্যাকাউন্ট খুলুন</button>
<p><span id="forgotBtn" style="color:#d63031;cursor:pointer;font-weight:bold;text-decoration:underline">পাসওয়ার্ড ভুলে গেছেন?</span></p>
<div class="divider">অথবা সোশ্যাল লগইন</div>
<button class="social-btn google-btn" id="googleBtn">Continue with Google</button>
<button class="social-btn facebook-btn" id="facebookBtn">Continue with Facebook</button>
<p id="authStatus" class="status-msg" role="status"></p>
</div>

<div id="appContainer" class="hidden">
<header><h1>🎵 আমার গানের খাতা 🎶</h1><div class="search-wrapper"><input type="text" id="globalSearch" class="search-bar" placeholder="গান, ক্যাটাগরি খুঁজুন..."></div><div class="user-info"><span id="userEmailDisplay"></span><button class="btn" id="logoutBtn" style="background:#d63031;padding:6px 10px;font-size:12px">Logout</button></div></header>
<div class="nav-tabs" id="navTabs">
<button class="tab-btn active" data-tab="learned">Learned</button><button class="tab-btn" data-tab="learning">Learning</button><button class="tab-btn" data-tab="want-to-learn">Want to Learn</button><button class="tab-btn" data-tab="other-lists">Other Lists</button>
</div>
<div class="container">
<aside class="sidebar" id="categorySidebar"><h3>🎼 গান ক্যাটাগরি</h3><div id="categoryContainer"></div><input type="text" id="newCatInput" placeholder="নতুন ক্যাটাগরি লিখুন..."><button class="btn" id="addCategoryBtn" style="width:100%">Add New Category</button></aside>
<main class="main-content">
<div id="listView"><h2 id="viewTitle" style="color:#2c3e50;text-align:center;margin-top:20px;font-size:18px">👈 একটি ক্যাটাগরি সিলেক্ট করুন</h2><div id="itemAddForm" class="hidden" style="margin-top:15px;background:#f1f2f6;padding:15px;border-radius:8px"></div><div id="listContainer" style="margin-top:20px"></div></div>
<div id="detailView" class="hidden diary-page"><button class="btn" id="backBtn" style="background:#d63031;margin-bottom:20px;width:100%">⬅ খাতা বন্ধ করুন</button><h2 id="detTitle"></h2>
<div class="song-meta-row"><span>🎼 তাল: <input type="text" id="detTaal" class="meta-item-editable"></span><span>🎹 স্কেল: <input type="text" id="detScale" class="meta-item-editable"></span></div>
<label class="section-label" for="detLyrics">📝 লিরিক্স</label><textarea id="detLyrics" class="nobox-textarea" rows="4"></textarea>
<label class="section-label" for="detSwaralipi">🎶 স্বরলিপি</label><textarea id="detSwaralipi" class="nobox-textarea" rows="4"></textarea>
<label class="section-label" for="detDesc">📖 বিস্তারিত বিবরণ</label><textarea id="detDesc" class="boxed-textarea" rows="4"></textarea>
<div class="audio-link-section"><strong style="color:#0288d1;display:block">🔗 অনলাইন অডিও লিংক</strong><input type="url" id="detAudioLink" placeholder="এখানে অডিও বা ভিডিও লিংক পেস্ট করুন..."><div id="audioPlayContainer"></div></div>
<p id="saveStatus" class="status-msg" role="status"></p></div>
</main></div></div>
<div id="playlistModal" class="modal"><div class="modal-content"><h3 style="margin-top:0;color:#e67e22">প্লেলিস্ট সিলেক্ট করুন</h3><div id="modalListContainer"></div><button class="btn" id="closeModalBtn" style="background:#d63031;margin-top:10px;width:100%">বন্ধ করুন</button></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,onAuthStateChanged,GoogleAuthProvider,FacebookAuthProvider,signInWithPopup,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// আপনার নিজের সম্পূর্ণ Firebase config এখানে বসান; গোপন রাখা অংশের সঠিক মান ব্যবহার করুন।
const firebaseConfig ={
  apiKey: "AIzaSyADSxl61rvEXNArEWyDsjw0Ghn5C5iZcVY",
  authDomain: "ganer-khata.firebaseapp.com",
  projectId: "ganer-khata",
  storageBucket: "ganer-khata.firebasestorage.app",
  messagingSenderId: "902524657457",
  appId: "1:902524657457:web:af7441e3341a1ea8b55a10"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let currentUser=null,appData=defaultData(),currentTab="learned",currentCategory=null,currentSongId=null,selectedSongForList=null,saveQueue=Promise.resolve(),searchTerm="";
const $=id=>document.getElementById(id);
function defaultData(){return {categories:["নজরুল সঙ্গীত","রবীন্দ্রসঙ্গীত","লালন গীতি"],songs:[],customLists:{"ফেবারিট":[],"পপুলার":[]}}}
function normalizeData(data){
 const d=data&&typeof data==="object"?data:{};
 return {categories:Array.isArray(d.categories)?d.categories:["নজরুল সঙ্গীত","রবীন্দ্রসঙ্গীত","লালন গীতি"],songs:Array.isArray(d.songs)?d.songs:[],customLists:d.customLists&&typeof d.customLists==="object"?d.customLists:{"ফেবারিট":[],"পপুলার":[]}};
}
function validEmail(email){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)}
function setAuthStatus(message){$("authStatus").textContent=message}
function authError(error){
 const map={"auth/invalid-credential":"ইমেইল অথবা পাসওয়ার্ড সঠিক নয়.","auth/email-already-in-use":"এই ইমেইল দিয়ে আগে অ্যাকাউন্ট তৈরি হয়েছে.","auth/weak-password":"পাসওয়ার্ড অন্তত ৬ অক্ষরের দিন.","auth/invalid-email":"সঠিক ইমেইল ঠিকানা দিন.","auth/popup-closed-by-user":"লগইন উইন্ডো বন্ধ করা হয়েছে.","auth/unauthorized-domain":"Firebase Console-এর Authorized domains-এ এই সাইটের ডোমেইন যোগ করুন."};
 return map[error.code]||error.message||"অজানা ত্রুটি হয়েছে।";
}
async function handleAuth(type){
 const email=$("emailInput").value.trim(),password=$("passInput").value;
 if(!email||!validEmail(email)){setAuthStatus("সঠিক ইমেইল ঠিকানা লিখুন।");return}
 if(type!=="reset"&&(!password||password.length<6)){setAuthStatus("পাসওয়ার্ড অন্তত ৬ অক্ষরের হতে হবে।");return}
 try{
  setAuthStatus("অপেক্ষা করুন…");
  if(type==="login")await signInWithEmailAndPassword(auth,email,password);
  else if(type==="register"){await createUserWithEmailAndPassword(auth,email,password);setAuthStatus("অ্যাকাউন্ট তৈরি হয়েছে।")}
  else {await sendPasswordResetEmail(auth,email);setAuthStatus("পাসওয়ার্ড রিসেট লিংক ইমেইলে পাঠানো হয়েছে।")}
 }catch(e){setAuthStatus(authError(e))}
}
$("loginBtn").addEventListener("click",()=>handleAuth("login"));
$("registerBtn").addEventListener("click",()=>handleAuth("register"));
$("forgotBtn").addEventListener("click",()=>handleAuth("reset"));
$("eyeIcon").addEventListener("click",()=>{$("passInput").type=$("passInput").type==="password"?"text":"password";$("eyeIcon").textContent=$("passInput").type==="password"?"👁️":"🙈"});
$("googleBtn").addEventListener("click",async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){setAuthStatus("Google লগইন ব্যর্থ: "+authError(e))}});
$("facebookBtn").addEventListener("click",async()=>{try{await signInWithPopup(auth,new FacebookAuthProvider())}catch(e){setAuthStatus("Facebook লগইন ব্যর্থ: "+authError(e))}});
$("logoutBtn").addEventListener("click",async()=>{try{await signOut(auth)}catch(e){alert("লগআউট ব্যর্থ: "+authError(e))}});
onAuthStateChanged(auth,async user=>{
 currentUser=user;
 $("authContainer").classList.toggle("hidden",!!user);$("appContainer").classList.toggle("hidden",!user);
 if(!user)return;
 $("userEmailDisplay").textContent=user.email||user.displayName||"ব্যবহারকারী";
 $("saveStatus").textContent="ক্লাউড ডেটা লোড হচ্ছে…";
 try{const snap=await getDoc(doc(db,"users",user.uid));appData=snap.exists()?normalizeData(snap.data().musicNotebookData):defaultData();renderCategories();renderCurrentView();$("saveStatus").textContent="";}
 catch(e){$("saveStatus").textContent="ডেটা লোড হয়নি: "+authError(e);alert("ক্লাউড ডেটা লোড করা যায়নি। Firebase Firestore Rules পরীক্ষা করুন.\n"+authError(e))}
});
function saveToStorage(){
 if(!currentUser)return Promise.resolve();
 const uid=currentUser.uid,payload=JSON.parse(JSON.stringify(appData));
 saveQueue=saveQueue.catch(()=>{}).then(()=>setDoc(doc(db,"users",uid),{musicNotebookData:payload},{merge:true}));
 $("saveStatus").textContent="ক্লাউডে সেভ হচ্ছে…";
 return saveQueue.then(()=>{$("saveStatus").textContent="✓ ক্লাউডে সেভ হয়েছে";}).catch(e=>{$("saveStatus").textContent="সেভ ব্যর্থ: "+authError(e);console.error(e)});
}
function make(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}
function closeMenus(){document.querySelectorAll(".dropdown-menu").forEach(m=>m.style.display="none")}
document.addEventListener("click",e=>{if(!e.target.closest(".three-dot")&&!e.target.closest(".dropdown-menu"))closeMenus()});
function makeMenuButton(menu){const b=make("span","three-dot","⋮");b.title="বিকল্প";b.addEventListener("click",e=>{e.stopPropagation();const was=menu.style.display==="block";closeMenus();menu.style.display=was?"none":"block"});return b}
function addMenuItem(menu,label,fn){const item=make("div","",label);item.addEventListener("click",e=>{e.stopPropagation();closeMenus();fn()});menu.appendChild(item)}
function renderCategories(){
 const c=$("categoryContainer");c.replaceChildren();
 appData.categories.forEach((cat,index)=>{
  const row=make("div","list-item"+(currentCategory===cat?" active":""));
  const name=make("span","",cat);name.style.flex="1";name.addEventListener("click",()=>selectCategory(cat));row.append(name);
  const menu=make("div","dropdown-menu");menu.id="catMenu_"+index;addMenuItem(menu,"⚙️ এডিট করুন",()=>editCategory(cat));addMenuItem(menu,"🗑️ ডিলিট করুন",()=>deleteCategory(cat));
  row.append(makeMenuButton(menu),menu);c.append(row);
 });
}
function selectCategory(cat){currentCategory=cat;renderCategories();$("viewTitle").textContent="📂 ক্যাটাগরি: "+cat;renderAddForm();renderSongs()}
function renderAddForm(){
 const f=$("itemAddForm");f.replaceChildren();f.classList.remove("hidden");
 const row=make("div","form-row"),input=make("input");input.id="newSongTitle";input.placeholder="নতুন গানের নাম…";input.style.margin="0";
 const btn=make("button","btn","Add");btn.addEventListener("click",addSong);input.addEventListener("keydown",e=>{if(e.key==="Enter")addSong()});row.append(input,btn);f.append(row);
}
function addCategory(){
 const input=$("newCatInput"),name=input.value.trim();if(!name)return;
 if(appData.categories.includes(name)){alert("এই ক্যাটাগরি আগে থেকেই আছে।");return}
 appData.categories.push(name);input.value="";saveToStorage();renderCategories();
}
$("addCategoryBtn").addEventListener("click",addCategory);
$("newCatInput").addEventListener("keydown",e=>{if(e.key==="Enter")addCategory()});
function editCategory(oldName){
 const raw=prompt("ক্যাটাগরির নতুন নাম:",oldName);if(raw===null)return;const name=raw.trim();if(!name||name===oldName)return;
 if(appData.categories.includes(name)){alert("এই নামে ক্যাটাগরি আগে থেকেই আছে।");return}
 appData.categories=appData.categories.map(c=>c===oldName?name:c);appData.songs.forEach(s=>{if(s.category===oldName)s.category=name});if(currentCategory===oldName)currentCategory=name;
 saveToStorage();renderCategories();renderCurrentView();
}
function deleteCategory(name){
 if(!confirm(`"${name}" ক্যাটাগরি এবং এর সব গান ডিলিট করতে চান?`))return;
 const ids=new Set(appData.songs.filter(s=>s.category===name).map(s=>s.id));
 appData.categories=appData.categories.filter(c=>c!==name);appData.songs=appData.songs.filter(s=>s.category!==name);
 Object.keys(appData.customLists).forEach(k=>appData.customLists[k]=appData.customLists[k].filter(id=>!ids.has(id)));
 if(currentCategory===name)currentCategory=null;saveToStorage();renderCategories();renderCurrentView();
}
function addSong(){
 const input=$("newSongTitle"),title=input.value.trim();if(!title||!currentCategory)return;
 appData.songs.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),title,category:currentCategory,status:currentTab,taal:"",scale:"",lyrics:"",swaralipi:"",description:"",audioLink:""});
 input.value="";saveToStorage();renderSongs();
}
function editSongTitle(id){const s=appData.songs.find(x=>x.id===id);if(!s)return;const v=prompt("গানের নতুন নাম:",s.title);if(v===null||!v.trim())return;s.title=v.trim();saveToStorage();renderSongs()}
function deleteSong(id){
 const s=appData.songs.find(x=>x.id===id);if(!s||!confirm(`"${s.title}" গানটি ডিলিট করতে চান?`))return;
 appData.songs=appData.songs.filter(x=>x.id!==id);Object.keys(appData.customLists).forEach(k=>appData.customLists[k]=appData.customLists[k].filter(sid=>sid!==id));
 if(currentSongId===id)backToListView();saveToStorage();renderSongs();
}
function moveSongStatus(id,status){const s=appData.songs.find(x=>x.id===id);if(!s)return;s.status=status;saveToStorage();renderSongs()}
function renderSongs(){
 const c=$("listContainer");c.replaceChildren();
 const songs=appData.songs.filter(s=>s.category===currentCategory&&s.status===currentTab&&matchesSearch(s));
 if(!songs.length){c.append(make("p","empty",searchTerm?"কোনো মিল পাওয়া যায়নি।":"কোনো গান নেই।"));return}
 songs.forEach(song=>{
  const row=make("div","list-item"),title=make("span","","🎵 "+song.title);title.style.cssText="font-weight:bold;flex:1;font-size:14px;cursor:pointer";
  title.addEventListener("click",()=>openSongDetail(song.id));row.append(title);
  const actions=make("div","");actions.style.cssText="display:flex;align-items:center;gap:4px";
  if(currentTab==="learning"){const b=make("button","btn","Complete");b.style.cssText="background:#2ecc71;padding:6px 8px;font-size:12px";b.addEventListener("click",()=>moveSongStatus(song.id,"learned"));actions.append(b)}
  if(currentTab==="want-to-learn"){const b=make("button","btn","Send");b.style.cssText="background:#9b59b6;padding:6px 8px;font-size:12px";b.addEventListener("click",()=>moveSongStatus(song.id,"learning"));actions.append(b)}
  const menu=make("div","dropdown-menu");if(currentTab!=="want-to-learn")addMenuItem(menu,"📂 লিস্টে যোগ",()=>openPlaylistModal(song.id));addMenuItem(menu,"⚙️ এডিট নাম",()=>editSongTitle(song.id));addMenuItem(menu,"🗑️ ডিলিট",()=>deleteSong(song.id));
  actions.append(makeMenuButton(menu),menu);row.append(actions);c.append(row);
 });
}
function openSongDetail(id){
 const song=appData.songs.find(s=>s.id===id);if(!song)return;currentSongId=id;
 $("listView").classList.add("hidden");$("detailView").classList.remove("hidden");$("detTitle").textContent="🎵 "+song.title;
 const fields={detTaal:"taal",detScale:"scale",detLyrics:"lyrics",detSwaralipi:"swaralipi",detDesc:"description",detAudioLink:"audioLink"};
 Object.entries(fields).forEach(([el,key])=>$(el).value=song[key]||"");renderAudioLink(song.audioLink||"");document.querySelectorAll("#detailView textarea").forEach(autoGrow);$("saveStatus").textContent="";
}
function autoGrow(el){el.style.height="auto";el.style.height=Math.max(el.scrollHeight,60)+"px"}
function backToListView(){$("detailView").classList.add("hidden");$("listView").classList.remove("hidden");currentSongId=null}
$("backBtn").addEventListener("click",backToListView);
const detailFields={detTaal:"taal",detScale:"scale",detLyrics:"lyrics",detSwaralipi:"swaralipi",detDesc:"description",detAudioLink:"audioLink"};
Object.entries(detailFields).forEach(([id,key])=>$(id).addEventListener("input",()=>{
 if(!currentSongId)return;const s=appData.songs.find(x=>x.id===currentSongId);if(!s)return;s[key]=$(id).value;
 if($(id).tagName==="TEXTAREA")autoGrow($(id));
 if(key==="audioLink")renderAudioLink(s.audioLink);
 saveToStorage();
}));
function renderAudioLink(value){
 const c=$("audioPlayContainer");c.replaceChildren();if(!value)return;
 try{const u=new URL(value);if(!["http:","https:"].includes(u.protocol))throw Error();
  const a=make("a","","লিংক খুলুন ↗");a.href=u.href;a.target="_blank";a.rel="noopener noreferrer";c.append(a);
 }catch{c.append(make("p","empty","সঠিক http:// অথবা https:// লিংক দিন।"))}
}
function openPlaylistModal(songId){
 selectedSongForList=songId;const c=$("modalListContainer");c.replaceChildren();
 const names=Object.keys(appData.customLists);if(!names.length)c.append(make("p","empty","কোনো প্লেলিস্ট নেই।"));
 names.forEach(name=>{const item=make("div","modal-item",name);item.addEventListener("click",()=>addSongToCustomList(name));c.append(item)});
 $("playlistModal").style.display="flex";
}
function addSongToCustomList(name){
 if(!Array.isArray(appData.customLists[name]))appData.customLists[name]=[];
 if(appData.customLists[name].includes(selectedSongForList)){alert("এই গানটি ইতিমধ্যে লিস্টে আছে।")}
 else{appData.customLists[name].push(selectedSongForList);saveToStorage();alert("লিস্টে যোগ করা হয়েছে।")}
 closeModal();
}
function closeModal(){$("playlistModal").style.display="none";selectedSongForList=null}
$("closeModalBtn").addEventListener("click",closeModal);
$("playlistModal").addEventListener("click",e=>{if(e.target===$("playlistModal"))closeModal()});
function createNewList(){
 const input=$("newListName"),name=input.value.trim();if(!name)return;
 if(Object.hasOwn(appData.customLists,name)){alert("এই নামের প্লেলিস্ট আগে থেকেই আছে।");return}
 appData.customLists[name]=[];saveToStorage();renderCustomListsView();
}
function deleteCustomList(name){if(!confirm(`"${name}" প্লেলিস্টটি ডিলিট করবেন?`))return;delete appData.customLists[name];saveToStorage();renderCustomListsView()}
function openCustomListSongs(name){
 const c=$("listContainer");c.replaceChildren();$("viewTitle").textContent="📂 "+name;
 const songs=(appData.customLists[name]||[]).map(id=>appData.songs.find(s=>s.id===id)).filter(Boolean).filter(matchesSearch);
 if(!songs.length)c.append(make("p","empty","এই প্লেলিস্টে কোনো গান নেই।"));
 songs.forEach(song=>{const row=make("div","list-item"),title=make("span","","🎵 "+song.title);title.style.flex="1";title.addEventListener("click",()=>openSongDetail(song.id));const remove=make("button","btn","লিস্ট থেকে সরান");remove.style.fontSize="12px";remove.addEventListener("click",()=>{appData.customLists[name]=appData.customLists[name].filter(id=>id!==song.id);saveToStorage();openCustomListSongs(name)});row.append(title,remove);c.append(row)});
}
function renderCustomListsView(){
 $("viewTitle").textContent="📂 কাস্টম প্লে-লিস্টসমূহ";const f=$("itemAddForm");f.replaceChildren();f.classList.remove("hidden");
 const row=make("div","form-row"),input=make("input");input.id="newListName";input.placeholder="নতুন লিস্টের নাম…";input.style.margin="0";const b=make("button","btn","Create");b.addEventListener("click",createNewList);input.addEventListener("keydown",e=>{if(e.key==="Enter")createNewList()});row.append(input,b);f.append(row);
 const c=$("listContainer");c.replaceChildren();
 Object.entries(appData.customLists).filter(([name])=>!searchTerm||name.toLowerCase().includes(searchTerm)).forEach(([name,ids],index)=>{
  const row=make("div","list-item"),title=make("span","",`📂 ${name} (${ids.length} টি গান)`);title.style.flex="1";title.addEventListener("click",()=>openCustomListSongs(name));const menu=make("div","dropdown-menu");addMenuItem(menu,"🗑️ ডিলিট করুন",()=>deleteCustomList(name));row.append(title,makeMenuButton(menu),menu);c.append(row)
 });
}
function matchesSearch(song){if(!searchTerm)return true;return [song.title,song.category,song.taal,song.scale,song.lyrics].some(v=>String(v||"").toLocaleLowerCase().includes(searchTerm))}
function handleSearch(){searchTerm=$("globalSearch").value.trim().toLocaleLowerCase();if(currentTab==="other-lists")renderCustomListsView();else if(currentCategory)renderSongs();else{renderCategories();$("listContainer").replaceChildren();$("viewTitle").textContent=searchTerm?"মিল থাকা ক্যাটাগরি সিলেক্ট করুন":"👈 একটি ক্যাটাগরি সিলেক্ট করুন"}}
$("globalSearch").addEventListener("input",handleSearch);
function renderCurrentView(){
 if(currentTab==="other-lists"){ $("categorySidebar").classList.add("hidden");renderCustomListsView();return}
 $("categorySidebar").classList.remove("hidden");renderCategories();
 if(currentCategory&&appData.categories.includes(currentCategory)){selectCategory(currentCategory)}else{$("viewTitle").textContent="👈 একটি ক্যাটাগরি সিলেক্ট করুন";$("itemAddForm").classList.add("hidden");$("listContainer").replaceChildren()}
}
function switchTab(tab){
 currentTab=tab;currentCategory=null;currentSongId=null;
 document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
 backToListView();$("listContainer").replaceChildren();$("itemAddForm").classList.add("hidden");
 if(tab==="other-lists"){$("categorySidebar").classList.add("hidden");renderCustomListsView()}
 else{$("categorySidebar").classList.remove("hidden");renderCategories();$("viewTitle").textContent="👈 একটি ক্যাটাগরি সিলেক্ট করুন"}
}
$("navTabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)switchTab(b.dataset.tab)});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(e=>console.warn("Service Worker registration failed:",e)))}
</script>
</body>
</html>
